<!doctype html>
<html lang="en">
  <body
    style="
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #10231f;
      background: #fbfaf7;
      padding: 24px;
    "
  >
    <div
      style="
        max-width: 460px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e7e3da;
        border-radius: 16px;
        padding: 28px;
      "
    >
      <p style="margin: 0 0 8px; font-weight: 700; font-size: 18px">Your Rolestash sign-in code</p>
      <p style="margin: 0 0 20px; color: #4c5b57">
        Enter this code in the Rolestash extension. It expires in 10 minutes.
      </p>
      <p
        style="
          margin: 0 0 20px;
          font-size: 32px;
          font-weight: 700;
          letter-spacing: 8px;
          color: #0b5d52;
        "
      >
        {{ .Token }}
      </p>
      <p style="margin: 0; color: #4c5b57; font-size: 14px">
        Didn't ask for this? You can ignore this email; nobody can sign in without the code.
      </p>
    </div>
    <p
      style="
        max-width: 460px;
        margin: 16px auto 0;
        color: #4c5b57;
        font-size: 12px;
        text-align: center;
      "
    >
      Rolestash · support@rolestash.com
    </p>
  </body>
</html>
