<!doctype html>
<!--
  Hand-built from SmartRecruiters' one-click application form (ids, names
  and autocomplete as published in its candidate UI). The live form refuses
  automated browsers, so this isn't a live capture.
-->
<html lang="en">
  <head><meta charset="utf-8" /><title>Application - Harbourline</title></head>
  <body>
    <form class="oneclick-form">
      <label for="first-name-input">First name</label>
      <input id="first-name-input" name="firstName" type="text" autocomplete="given-name" required />
      <label for="last-name-input">Last name</label>
      <input id="last-name-input" name="lastName" type="text" autocomplete="family-name" required />
      <label for="email-input">Email</label>
      <input id="email-input" name="email" type="email" autocomplete="email" required />
      <label for="confirm-email-input">Confirm your email</label>
      <input id="confirm-email-input" name="confirmEmail" type="email" required />
      <label for="location-input">City</label>
      <input id="location-input" name="location" type="text" autocomplete="address-level2" />
      <label for="phone-number-input">Phone</label>
      <input id="phone-number-input" name="phoneNumber" type="tel" autocomplete="tel" />
      <label for="linkedin-input">LinkedIn profile</label>
      <input id="linkedin-input" name="linkedin" type="url" />
      <label for="website-input">Website</label>
      <input id="website-input" name="website" type="url" />
      <label for="resume-input">Resume</label>
      <input id="resume-input" name="resume" type="file" />
      <label for="message-input">Message to the Hiring Team</label>
      <textarea id="message-input" name="message"></textarea>
    </form>
  </body>
</html>
